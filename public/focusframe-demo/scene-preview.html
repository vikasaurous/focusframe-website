<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFrame — Pixel Scene</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Geist+Pixel&display=swap" />
  <link rel="stylesheet" href="src/scene/scene.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #0d0e11;
      overflow: hidden;
    }
    /* Full-bleed scene container */
    #scene-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    /* Override scene.css grid positioning — here it's standalone */
    .scene {
      grid-column: unset;
      grid-row: unset;
      position: relative;
      flex: 1;
      min-height: 0;
      margin-top: 0;
      align-self: stretch;
    }
    /* Night sky fills the top area above the scene canvas */
    #sky-fill {
      position: absolute;
      inset: 0;
      background: #0d0e11;
      z-index: 0;
    }
    .scene-stage {
      z-index: 1;
    }
    /* Ground strip below the scene */
    #ground-strip {
      height: 20px;
      background: #0d0e11;
      flex-shrink: 0;
    }
    /* Info label at top */
    #scene-label {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.3);
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
    }
    /* Pet selector at bottom */
    #pet-bar {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 10;
    }
    .pet-btn {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      letter-spacing: 0.08em;
    }
    .pet-btn:hover, .pet-btn.active {
      color: #e8603c;
      border-color: #e8603c;
      background: rgba(232,96,60,0.1);
    }
    /* Day/night toggle */
    #time-label {
      position: fixed;
      top: 12px;
      right: 16px;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.3);
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="scene-label">PIXEL SCENE · SCENE ENGINE</div>
  <div id="time-label" id="clock-label">—</div>
  <div id="scene-wrap">
    <div class="scene" id="scene" role="group" aria-label="Pixel scene"></div>
    <div id="ground-strip"></div>
  </div>
  <div id="pet-bar">
    <button class="pet-btn active" data-pet="cat">Cat</button>
    <button class="pet-btn" data-pet="dog">Dog</button>
    <button class="pet-btn" data-pet="dino">Dino</button>
  </div>

  <script src="src/scene/sceneSprites.js"></script>
  <script src="src/scene/sceneEngine.js"></script>
  <script src="src/scene/sceneRenderer.js"></script>
  <script>
    var currentPet = "cat";
    var sceneCtl = null;

    function updateClock() {
      var now = new Date();
      var h = now.getHours();
      var m = String(now.getMinutes()).padStart(2, "0");
      var period = h >= 12 ? "PM" : "AM";
      var h12 = h % 12 || 12;
      var label = document.getElementById("time-label");
      if (label) label.textContent = h12 + ":" + m + " " + period;
    }

    function startScene(pet) {
      var container = document.getElementById("scene");
      // Destroy existing scene
      if (sceneCtl) { try { sceneCtl.destroy(); } catch(e) {} }
      // Clear container
      while (container.firstChild) container.removeChild(container.firstChild);
      // Init new scene
      sceneCtl = window.FFScene.init(container, { pet: pet, enabled: true });
    }

    // Pet buttons
    document.querySelectorAll(".pet-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        document.querySelectorAll(".pet-btn").forEach(function(b) { b.classList.remove("active"); });
        btn.classList.add("active");
        currentPet = btn.dataset.pet;
        startScene(currentPet);
      });
    });

    // Start
    startScene(currentPet);
    updateClock();
    setInterval(updateClock, 10000);
  </script>
</body>
</html>
