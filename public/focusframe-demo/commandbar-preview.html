<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFrame — Command Bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=Geist+Pixel&display=swap" />
  <link rel="stylesheet" href="src/commandbar/commandBar.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #e8603c;
      --panel: #181a1f;
      --panel-hover: #1e2026;
      --paper: #f4f5f8;
      --soft: rgba(255,255,255,0.08);
      --muted: rgba(255,255,255,0.35);
      --line: rgba(255,255,255,0.1);
      --focus: rgba(232,96,60,0.4);
    }
    html, body {
      width: 100%; height: 100%;
      background: #0d0e11;
      font-family: "JetBrains Mono", monospace;
      overflow: hidden;
      color: #e1e2e5;
    }
    /* Blurred background simulating the dashboard behind the bar */
    #bg {
      position: fixed;
      inset: 0;
      background: #0d0e11;
      background-image:
        radial-gradient(ellipse 60% 40% at 20% 60%, rgba(232,96,60,0.04) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 30%, rgba(255,255,255,0.02) 0%, transparent 60%);
    }
    /* Fake dashboard content behind the bar (blurred) */
    #fake-dash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 32px 48px;
      gap: 8px;
      filter: blur(3px) brightness(0.5);
      pointer-events: none;
      user-select: none;
    }
    .fd-clock {
      font-size: clamp(32px, 6vw, 72px);
      font-weight: 300;
      letter-spacing: -0.01em;
      color: #e1e2e5;
      font-family: "Instrument Serif", serif;
    }
    .fd-label {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.3);
    }
    .fd-modules {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .fd-module {
      width: 180px;
      height: 100px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
    }
    /* Info label */
    #cmd-label {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.3);
      white-space: nowrap;
      z-index: 20;
      pointer-events: none;
    }
    /* Keep cb-root always visible in preview mode */
    .cb-root {
      visibility: visible !important;
      pointer-events: auto !important;
      transition: none !important;
    }
    /* Prevent scrim from covering entire bg — keep partial opacity */
    .cb-scrim {
      opacity: 1 !important;
      transition: none !important;
    }
    /* Keep panel always at its final position */
    .cb-panel {
      transform: translate3d(-50%, 0, 0) !important;
      transition: none !important;
    }
    /* Suppress navigation attempts (we're in an iframe) */
  </style>
</head>
<body>
  <div id="bg"></div>
  <div id="fake-dash" aria-hidden="true">
    <div class="fd-clock" id="fd-clock">9:41 AM</div>
    <div class="fd-label">Pick the one thing that matters today</div>
    <div class="fd-modules">
      <div class="fd-module"></div>
      <div class="fd-module"></div>
      <div class="fd-module"></div>
    </div>
  </div>
  <div id="cmd-label">COMMAND BAR · ALT + K</div>

  <!-- Command bar scripts -->
  <script src="src/commandbar/commands.js"></script>
  <script src="src/commandbar/ripple.js"></script>
  <script src="src/commandbar/commandBar.js"></script>
  <script>
    // Update fake clock
    (function updateClock() {
      var now = new Date();
      var h = now.getHours() % 12 || 12;
      var m = String(now.getMinutes()).padStart(2, "0");
      var p = now.getHours() >= 12 ? "PM" : "AM";
      var el = document.getElementById("fd-clock");
      if (el) el.textContent = h + ":" + m + " " + p;
    })();

    // Initialize command bar with all defaults enabled
    var settings = window.FFCommands
      ? window.FFCommands.mergeSettings({ enabled: true })
      : { enabled: true };

    // Navigate safely inside iframe — open links in new tab
    function navigate(url, opts) {
      try {
        window.open(url, "_blank", "noopener,noreferrer");
      } catch(e) {}
    }

    if (window.CommandBar) {
      CommandBar.init({
        settings: settings,
        onChange: function() {},
        navigate: navigate,
      });

      // Force open immediately — override the guard so it opens without keyboard
      // We patch open() by calling it after removing the !settings.enabled guard
      // The easiest way: temporarily call open() which checks _ready & _settings.enabled
      // Since settings.enabled = true and init() sets _ready, open() should work:
      setTimeout(function() {
        try { CommandBar.open(); } catch(e) {}
      }, 80);

      // Prevent closing via Escape or scrim click in preview
      // We override close() to re-open immediately
      var _origClose = CommandBar.close;
      CommandBar.close = function() {
        // In preview mode, closing immediately re-opens
        setTimeout(function() {
          try { CommandBar.open(); } catch(e) {}
        }, 50);
      };
    }
  </script>
</body>
</html>
